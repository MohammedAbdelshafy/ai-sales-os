[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-os"
version = "0.1.0"
description = "Turn an approved opportunities CSV into an evidence-backed qualification queue: per-row ICP pass/fail evidence, next-action list with deterministic deadlines, and a manager exception report."
authors = [{name = "Mohammed Abdelshafy"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
ai-sales-os = "ai_sales_os.cli:main"

[tool.setuptools.packages.find]
include = ["ai_sales_os*"]
